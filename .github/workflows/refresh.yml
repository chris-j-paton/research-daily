name: Refresh papers

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC (07:00 BST / 06:00 GMT)
  workflow_dispatch: {}      # lets you press "Run workflow" on GitHub by hand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest papers
        run: python fetch.py
      - name: Commit updated data
        run: |
          git config user.name "research-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/papers.json data/papers.js
          git diff --cached --quiet || git commit -m "Refresh papers $(date -u +%F)"
          git push
